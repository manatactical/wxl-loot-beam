; wxl-loot-beam configuration.
;
; A beam of light that rises into the sky over every NPC body that can still be looted, so a corpse
; is found by a beam instead of by hunting for its nameplate.
;
; Every knob the in-game "Loot Beam" panel exposes lives here too, so the look can be retuned from a
; text editor. This file is read live while the client runs: after saving a change here the module
; notices within about a second and applies it, no restart and no overlay needed. The panel's Save
; button writes the current slider values back into this file.
;
; Values are clamped to the ranges the panel uses, so an out-of-range number will not break anything.
; Lines beginning with ';' are comments and are left alone by Save.

[LootBeam]

; --- master ---------------------------------------------------------------------------------
; 1 turns the beacon on, 0 leaves corpses unmarked.
Enabled=1

; --- shape ----------------------------------------------------------------------------------
; How far the beam rises above the corpse, in yards.
Height=20
; Half-width of the beam where it meets the ground, in yards. It tapers toward the top.
BeamWidth=0.5
; How far above the body the shaft begins, in yards. It starts fully transparent there and gathers
; as it rises, so it floats rather than growing out of the corpse.
BaseOffset=1.0
; Minimum half-width per yard of camera distance, so a distant beam stays a legible column instead
; of thinning to a thread (0 disables it and leaves the fixed width/taper alone).
WidthPerYard=0.01
; Opacity of the beam along its length, 0..1.
BeamAlpha=0.75
; Tint of the light, as #RRGGBB (or R,G,B with 0-255 components).
Color=#FFD070

; --- motion ---------------------------------------------------------------------------------
; Slow breathing depth, 0 (steady) .. 1 (fades to nothing at the trough of the pulse).
Pulse=0.2
; How fast the breathing runs.
PulseSpeed=1.6
; Seconds for a beacon to ease in when a body appears, and to ease away when it is looted or gone.
; 0 makes the change instant.
FadeIn=0.35
FadeOut=0.7

; --- sparkles -------------------------------------------------------------------------------
; Small motes that drift and twinkle around the beam. Each corpse's field is seeded from its own
; GUID, so no two bodies sparkle in lockstep, and each mote drifts, flickers and is reborn on its
; own schedule. 1 = draw them, 0 = the beam stays clean.
Sparkles=1
; Motes per beacon, 0..32.
SparkleCount=24
; Half-size of a mote, yards.
SparkleSize=0.04
; Peak opacity of a mote at the crest of its twinkle, 0..1.
SparkleAlpha=0.9
; Upward drift and lateral wander of a mote, yards/s.
SparkleRise=1.0
SparkleDrift=0.05
; Seconds a mote lives before it is reborn elsewhere in the beam, and how fast it flickers.
SparkleLife=2.4
SparkleTwinkle=6.0

; --- selection ------------------------------------------------------------------------------
; Ignore corpses farther than this, yards. 0 = unlimited.
MaxDistance=0
; 1 = raise the beam; 0 draws only the sparkles.
ShowBeam=1
; 0 (default) = let the world occlude the beam, as light would be; 1 = draw through terrain and
; walls, so a corpse tucked behind a rise is never missed.
ThroughWalls=0
; How many yards to pull the beacon toward the camera along its view ray while ThroughWalls=0. At
; range the client renders terrain at a coarser LOD that sits above the collision height the beacon is
; placed on, so a plain depth test hides the beacon beyond a few yards. The pull changes depth only,
; never screen position, so it clears that LOD without letting the beacon through real cover. Raise it
; if the beacon still vanishes at range; lower it toward 0 if it pokes through nearby walls.
DepthPush=1.5
; Extra pull per yard of camera distance, for depth error that grows with range (0.02 = two yards per
; hundred). Raise if the beacon still disappears far away. 0 disables the distance scaling.
DepthPushPerYard=0.02
; 1 = only beam corpses the server still flags lootable (UNIT_DYNAMIC_FLAGS bit 0), so an
; already-looted body goes dark; 0 = beam any dead NPC.
RequireLootable=1
; 1 (default) = tint a corpse's beacon with the quality colour of the rarest item its loot holds
; (grey/white/green/blue/purple/orange/...); 0 = always use Color above. The 3.3.5a client only
; learns a corpse's loot when the loot window is opened for it, so the tint appears on a body once
; it has been opened; while a body's loot is unknown the beam keeps Color.
LootColor=1
; 1 (default) = also read the quality the server put on the corpse (the companion AzerothCore module
; mod-loot-beam writes the best quality in the corpse's rolled loot into an unused unit field at
; death) so the beam is the right colour the instant the body dies, before the loot window opens.
; The server hint and the loot the client discovers are merged: whichever holds the rarer item wins,
; so the server can colour a body early without pinning it below a rarer item the client later sees.
; 0 = ignore the server and only use the loot the client discovers for itself. Has no effect on a
; server that does not run the module: the field then reads 0 and the client falls back to LootColor.
ServerColor=1

; --- gear tiers -----------------------------------------------------------------------------
; One colour and one on/off switch per tier, all editable live from the "Gear tiers" section of the
; in-game panel too. A tier switched to Enabled=0 produces no beacon at all for corpses whose best
; loot falls into it, so unwanted drops (bare currency, greys, ...) can be hidden and the rest kept.
;
; Currency is a corpse whose loot held money but no gear (the server flags it; the client cannot tell
; on its own). Poor..Heirloom are the item qualities 0..7. A body whose loot is not known still uses
; the Color above until the tier is learned.
Tier.Currency.Enabled=1
Tier.Currency.Color=#000000
Tier.Poor.Enabled=1
Tier.Poor.Color=#000000
Tier.Common.Enabled=1
Tier.Common.Color=#000000
Tier.Uncommon.Enabled=1
Tier.Uncommon.Color=#1EFF00
Tier.Rare.Enabled=1
Tier.Rare.Color=#0032FF
Tier.Epic.Enabled=1
Tier.Epic.Color=#9600FF
Tier.Legendary.Enabled=1
Tier.Legendary.Color=#FF8000
Tier.Artifact.Enabled=1
Tier.Artifact.Color=#E6CC80
Tier.Heirloom.Enabled=1
Tier.Heirloom.Color=#00CCFF
